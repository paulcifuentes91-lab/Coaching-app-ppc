name: Recuperar progressLog (temporal)

# Flujo temporal para el caso Nicole Jerez (nov-2026). Corre solo en esta
# rama, al subir cambios a scripts/recuperar-progresslog.json. No se
# fusiona a main: la rama se borra al terminar.
on:
  push:
    branches: [claude/recuperar-progresslog-nicole]

jobs:
  recuperar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install firebase-admin
      - run: node scripts/recuperar-progresslog.js
        env:
          FIREBASE_KEY: ${{ secrets.FIREBASE_KEY }}
